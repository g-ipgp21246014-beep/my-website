<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>看图写话小游戏：小心地上的水</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9f4fb;--card:#fff;--ink:#1d3347;--mut:#58708a;--line:#c5dcec;--main:#2a7fc1;--onmain:#fff;--ok:#23904f;--okbg:#e0f5e8;--bad:#c9482a;--badbg:#fdeae3;--star:#f2a900}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13202b;--card:#1d2e3c;--ink:#e8f1f8;--mut:#9db3c6;--line:#34506a;--main:#5aa9e6;--onmain:#0b1a26;--ok:#5ccf8c;--okbg:#1c3a2a;--bad:#ff8a65;--badbg:#3d2620}}
:root[data-theme="dark"]{--bg:#13202b;--card:#1d2e3c;--ink:#e8f1f8;--mut:#9db3c6;--line:#34506a;--main:#5aa9e6;--onmain:#0b1a26;--ok:#5ccf8c;--okbg:#1c3a2a;--bad:#ff8a65;--badbg:#3d2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) repeating-linear-gradient(transparent 0 35px,var(--line) 35px 36px);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:20px;line-height:1.6}
#app{max-width:640px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-family:"Kaiti SC","KaiTi","STKaiti","楷体",serif;font-size:28px;margin:6px 0}
.st{background:var(--card);border:3px solid var(--star);border-radius:999px;padding:2px 14px;font-weight:700;white-space:nowrap}
.bar{height:10px;background:var(--card);border:2px solid var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main);transition:width .4s}
.lv{margin:10px 0 6px;color:var(--mut);font-weight:700}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px}
.q{font-family:"Kaiti SC","KaiTi","STKaiti","楷体",serif;font-size:clamp(22px,5.5vw,28px);margin:4px 0 12px;line-height:1.5}
.sp{border:0;background:none;font-size:24px;cursor:pointer;vertical-align:middle}
.big{width:100%;border-radius:14px;border:3px solid var(--line);display:block;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;padding:0;border:4px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;overflow:hidden}
.tile img{width:100%;display:block}
.tile.done{border-color:var(--ok)}
.tile.shake{animation:sk .35s}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.badge{position:absolute;left:6px;top:6px;width:38px;height:38px;border-radius:50%;background:var(--star);color:#1d3347;font-weight:800;font-size:24px;display:grid;place-items:center}
.badge[hidden]{display:none}
.opts{display:grid;gap:10px}
.opt,.go{font:inherit;font-size:22px;min-height:58px;padding:8px 14px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}
.opts.w{grid-template-columns:1fr 1fr}.opts.w .opt{text-align:center}
.opt:focus-visible,.go:focus-visible,.tile:focus-visible{outline:4px solid var(--star);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg);opacity:.7}
.go{background:var(--main);color:var(--onmain);border-color:var(--main);font-weight:700;text-align:center;width:100%;margin-top:12px}
.fb{min-height:34px;margin:10px 0 0;font-weight:700}
.fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}
ul.tips{padding-left:1.2em;margin:8px 0}
ul.tips li{margin:6px 0}
.sc{font-size:44px;text-align:center;margin:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"><header><h1>小心地上的水</h1><div class="st" id="st">⭐ 0</div></header><div class="bar"><i id="pg" style="width:0"></i></div><div id="m"></div></div>

const T=S.length+1;let stars=0,step=-1,order=[],mist=0,tiles=[],tries=0;
const up=()=>{$('#st').textContent="⭐ "+stars;$('#pg').style.width=Math.max(0,step+1)/T*100+"%"};
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/＿+/g,"空格"));u.lang="zh-CN";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function fb(c,t){const f=$('#fb');f.className="fb "+c;f.innerHTML=t}
function start(){stars=0;step=-1;order=[];mist=0;tiles=sh([0,1,2,3]);up();
m.innerHTML=`<div class="card" style="margin-top:12px"><p class="q">图里发生了一件事。先把故事弄明白，再写你自己的段落吧！</p><ul class="tips"><li>第一关：把图片排好顺序</li><li>第二关：看图想一想</li><li>第三关：用词语把句子补完整</li></ul><button class="go" onclick="lvl1()">开始玩</button></div>`}
function lvl1(){step=0;up();
m.innerHTML=`<p class="lv">第一关 · 排一排</p><div class="card"><p class="q">图片的顺序乱了！按故事发生的先后，依次点一点图片。</p><div class="grid">${tiles.map((p,i)=>`<button class="tile" id="t${i}" onclick="pick(${i})" aria-label="图片${i+1}"><img src="${P[p]}" alt=""><span class="badge" hidden></span></button>`).join("")}</div><p id="fb" class="fb"></p><div id="nx"></div></div>`}
function pick(i){const p=tiles[i],b=$('#t'+i);if(order.includes(p))return;
if(p===order.length){order.push(p);b.classList.add("done");const s=b.querySelector(".badge");s.hidden=false;s.textContent=order.length;
if(order.length<4)fb("good","对了！接下来找第"+(order.length+1)+"幅。");
else{if(!mist)stars++;up();fb("good","全部排对了！"+(mist?"":"一次就成功，真棒！"));$('#nx').innerHTML=`<button class="go" onclick="next()">下一关</button>`}}
else{mist++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");fb("bad","再想一想，现在要找第"+(order.length+1)+"幅图。")}}
function next(){step++;step-1<S.length?quiz():end()}
function quiz(){const s=S[step-1];tries=0;up();
m.innerHTML=`<p class="lv">${s.lv}（${step}/${S.length}）</p><div class="card">${s.img!=null?`<img class="big" src="${P[s.img]}" alt="">`:""}<p class="q">${s.q} <button class="sp" aria-label="朗读" onclick="speak(S[step-1].q)">🔊</button></p><div class="opts${s.wide?" w":""}">${s.o.map((t,i)=>`<button class="opt" id="o${i}" onclick="ans(${i})">${t}</button>`).join("")}</div><p id="fb" class="fb"></p><div id="nx"></div></div>`}
function ans(i){const s=S[step-1],b=$('#o'+i);if(b.disabled)return;
if(i===s.a){if(!tries)stars++;document.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("ok");up();fb("good","答对了！"+s.w);$('#nx').innerHTML=`<button class="go" onclick="next()">${step<S.length?"下一题":"完成"}</button>`}
else{tries++;b.disabled=true;b.classList.add("no");fb("bad","再想一想，看看图。")}}
function end(){step=T;up();
m.innerHTML=`<div class="card" style="margin-top:12px"><p class="sc">🎉</p><p class="q" style="text-align:center">你得到 ${stars} 颗星（满分 ${T}）！</p><p class="q">现在你已经明白故事了。回到作业纸，写下你自己的段落。写之前，先想一想：</p><ul class="tips"><li>谁？在哪里？发生了什么事？</li><li>${A}洒了水以后，有没有擦干？</li><li>${B}踩到水，怎么了？他的感觉怎样？</li><li>${A}后来怎么做？${B}怎么回答？</li></ul><p>记得用上：${V.join("、")}。</p><button class="go" onclick="start()">再玩一次</button></div>`}
start();
</script></body></html>
